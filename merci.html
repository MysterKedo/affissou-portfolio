<!DOCTYPE html>
<html lang="fr" x-data="{ dark: localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches) }" :class="{'dark':dark}" class="scroll-smooth">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="32x32"/>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png"/>
  <link rel="manifest" href="site.webmanifest"/>
  <meta name="theme-color" content="#FF6B2B"/>
  <meta name="robots" content="noindex"/>
  <title>Message bien reçu · Affissou EGBEBI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&display=swap" rel="stylesheet"/>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{display:['PT Sans','sans-serif'],body:['DM Sans','sans-serif']},colors:{accent:'#FF6B2B','accent-light':'#FF8F5C'}}}}</script>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    html{font-family:'DM Sans',sans-serif;}
    h1,h2,h3{font-family:'PT Sans',sans-serif;}
    ::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:#FF6B2B;border-radius:99px;}
    .btn-primary{position:relative;overflow:hidden;}
    .btn-primary::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:rgba(255,255,255,.18);transform:skewX(-20deg);transition:left .4s cubic-bezier(.4,0,.2,1);}
    .btn-primary:hover::after{left:160%;}
    body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.4;}

/* Justification des textes de contenu (avec cesure automatique, lang="fr") */
p.leading-relaxed{
  text-align:justify;
  text-justify:inter-word;
  -webkit-hyphens:auto;
  hyphens:auto;
}
.text-center p.leading-relaxed{text-align:center;hyphens:manual;}
  </style>
</head>
<body class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 font-body antialiased">

  <main class="min-h-screen flex items-center justify-center px-6 relative overflow-hidden">
    <div class="absolute top-1/4 right-0 w-96 h-96 bg-accent/10 rounded-full blur-3xl pointer-events-none" aria-hidden="true"></div>
    <div class="absolute bottom-1/4 left-0 w-64 h-64 bg-zinc-200/50 dark:bg-zinc-800/30 rounded-full blur-3xl pointer-events-none" aria-hidden="true"></div>

    <div class="relative z-10 text-center max-w-lg">
      <div class="w-16 h-16 mx-auto mb-8 flex items-center justify-center rounded-2xl bg-accent text-white shadow-lg">
        <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
      </div>

      <p class="text-xs font-medium text-accent tracking-widest uppercase mb-3">Message envoyé</p>
      <h1 class="font-display font-bold text-3xl md:text-4xl text-zinc-900 dark:text-white mb-4">Merci, votre message est bien arrivé</h1>
      <p class="text-zinc-500 dark:text-zinc-400 leading-relaxed mb-10">Je lis chaque message personnellement et je réponds sous 24 à 48 heures. Si votre demande est urgente, écrivez-moi directement à <a href="mailto:affissouegbebi@gmail.com" class="text-accent underline underline-offset-4">affissouegbebi@gmail.com</a> ou passez par WhatsApp.</p>

      <div class="flex flex-wrap gap-4 justify-center">
        <a href="index.html" class="btn-primary inline-flex items-center gap-2 bg-accent text-white font-medium px-7 py-3.5 rounded-full hover:bg-accent-light transition-colors text-sm">Retour à l'accueil</a>
        <a href="projects.html" class="inline-flex items-center gap-2 border border-zinc-300 dark:border-zinc-700 text-zinc-700 dark:text-zinc-300 font-medium px-7 py-3.5 rounded-full hover:bg-zinc-50 dark:hover:bg-zinc-900 transition-colors text-sm">Parcourir mes projets</a>
      </div>

      <p class="text-xs text-zinc-400 mt-12">© <span id="yr"></span> Affissou EGBEBI</p>
    </div>
  </main>

  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>

</body>
</html>
